# =====================================================================
# CONFIGURACIÓN DE CONEXIÓN A POSTGRESQL
# =====================================================================

# URL de la base de datos (reemplaza 'techmentor' por el nombre real de tu DB si es otro)
spring.datasource.url=jdbc:postgresql://localhost:5432/techmentor

# Tu usuario de PostgreSQL (por defecto suele ser 'postgres')
spring.datasource.username=postgres

# La contraseña que asignaste a tu usuario de PostgreSQL
spring.datasource.password=root

# Driver oficial de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# =====================================================================

# Dialecto para que Hibernate genere las consultas SQL optimizadas para Postgres
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Comportamiento de la base de datos al iniciar la aplicación:
# update: Actualiza las tablas existentes en base a tus entidades (Recomendado para desarrollo)
# none: No hace nada, asume que la base de datos ya está creada (Recomendado para producción)
# create-drop: Borra y recrea las tablas cada vez que inicias y apagas la aplicación
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola de la terminal las consultas SQL que ejecuta Spring Boot
spring.jpa.show-sql=true

# Formatea el SQL en la consola para que sea fácil de leer
spring.jpa.properties.hibernate.format_sql=true

