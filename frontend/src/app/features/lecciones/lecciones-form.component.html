<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
          <h3 class="fw-bold text-dark mb-3">Registrar Lección</h3>
          
          <form [formGroup]="leccionForm" (ngSubmit)="guardar()">
            <div class="mb-3">
              <label class="form-label fw-semibold">Título</label>
              <input type="text" class="form-control" formControlName="titulo">
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">Contenido</label>
              <textarea class="form-control" formControlName="contenido" rows="3"></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-light border px-4" routerLink="../">Cancelar</button>
              <button type="submit" class="btn btn-primary px-4" style="background-color: #6c5ce7; border: none;">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
